name: Build Custom APK

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone Extractor Dependency
        run: |
          cd ..
          git clone https://github.com/InfinityLoop1308/PipePipeExtractor.git

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-configuration-cache --no-daemon -Dorg.gradle.configuration-cache=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-PipePipe-APK
          path: app/build/outputs/apk/debug/*.apk
          
